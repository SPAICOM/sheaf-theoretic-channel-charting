type: dichasus  # used by train.py to select DICHASUSDataModule

data_dir: dichasus  # directory where .tfrecords and reftx-offsets-*.json are stored

# List of file stems to load (val/test split from same files)
files:
  - dichasus-cf02
  - dichasus-cf03
  - dichasus-cf04

# Sample-level split (splits from loaded files).
# If set, train_files/val_files/test_files are ignored.
train_split: 0.7
val_split: 0.15
test_split: 0.15

# File-level split (deprecated if train_split is set above).
# Each is a list of file stems.
# train_files:
#   - dichasus-cf02
#   - dichasus-cf03
#   - dichasus-cf04
# val_files:
#   - dichasus-cf05
# test_files:
#   - dichasus-cf06

# Virtual BS groups: each inner list is one virtual BS made of physical BS IDs.
# Single-element lists = no aggregation (each physical BS is its own virtual BS).
# n_agents = number of groups; feature_dim scales with group size.
# No aggregation (4 independent BSs):
bs_aggregation:
  - [0, 1]
  - [2, 3]

# Number of antennas per base station
antennas_per_bs: 8

batch_size: 256  # Reduced for lazy loading performance
num_workers: 0
pin_memory: true

preprocess: dichasus  # subcarrier-chunk averaging (matches DICHASUS tutorial)

# Time-coherence windows (seconds)
#   Positives : |Δt| ≤ Tc_pos
#   Negatives : Tc_pos < |Δt| ≤ Tc_neg
Tc_pos: 1.5
Tc_neg: 5.0

pair_mode: triplet
n_pos: 10
n_neg: 10

# BS-pair edges for shared (inter-BS alignment) datasets.
# Indices are virtual BS indices (0-indexed into bs_aggregation groups).
# No-aggregation chain topology across 4 physical BSs:
edge_set:
  - [0, 1]
  - [1, 2]
  - [2, 3]
# With bs_aggregation [[0,1],[2,3]], use:
# edge_set:
#   - [0, 1]

train_seed: 27
val_seed: 123
test_seed: 42

# Which split to visualize: train, val, or test
viz_split: test
viz_enabled: false  # Set to true to enable position visualization
