defaults:
  - _self_
  - dataset: dichasus_cf0x
  - model: siameseNN
  - orchestrator: single_agent

logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: sheaf_cc_single_agent
  name: single_agent_${now:%Y-%m-%d}_${now:%H-%M-%S}
  log_model: false

seed: 80

# Multi-fold training configuration
num_folds: 8  # Number of folds (1 = single training run)
anchor_seed: 80  # Seed for generating anchors (same across all folds)
triplet_seeds: [1,2,3,4,5,6,7,8]  # Seeds for triplet sampling (one per fold)
learning_rates: [1e-3, 1e-3, 1e-4, 1e-4, 1e-5, 1e-5, 1e-5, 1e-5]  # Learning rates (one per fold, descending order recommended)
separate_fold_runs: false  # If true, creates separate wandb run per fold

trainer:
  max_epochs: 10
  accelerator: auto
  devices: 1
  deterministic: false
  num_sanity_val_steps: 0
  log_every_n_steps: 10

callbacks: null

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.use_decoder: false
