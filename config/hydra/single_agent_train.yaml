defaults:
  - _self_
  - dataset: dichasus_cf0x
  - model: siameseNN
  - orchestrator: single_agent

logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: sheaf_cc_single_agent
  name: single_agent_${now:%Y-%m-%d}_${now:%H-%M-%S}
  log_model: false

seed: 80

trainer:
  max_epochs: 10
  accelerator: auto
  devices: 1
  deterministic: false
  num_sanity_val_steps: 2
  log_every_n_steps: 10

callbacks: null

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.use_decoder: false
